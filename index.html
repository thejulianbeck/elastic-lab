<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Elastic Lab — tarjetas de vidrio que se funden con la luz.">
  <title>Elastic Lab</title>
  <!-- build: elastic-lab-v2-smin-fillet-20261005x -->
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var root = document.documentElement;
      root.dataset.theme = "dark";
      root.dataset.material = "glass";
      root.classList.add("js");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", "#000000");
    })();
  </script>
</head>
<body>
  <div id="app">
    <canvas id="gl" aria-hidden="true"></canvas>

    <div id="cards-dom" aria-hidden="true"></div>

    <header class="chrome top">
      <div class="counter" id="counter">Amethyst <span>01 / 06</span></div>
      <p class="hint" id="hint">Desliza, arrastra o usa ↑ ↓</p>
      <aside class="panel" aria-label="Opciones">
        <div class="row">
          <span class="lbl">Fondo</span>
          <div class="seg" role="group" aria-label="Fondo">
            <button type="button" data-theme="dark" aria-pressed="true">Oscuro</button>
            <button type="button" data-theme="light" aria-pressed="false">Claro</button>
          </div>
        </div>
        <div class="row">
          <span class="lbl">Material</span>
          <div class="seg" role="group" aria-label="Material">
            <button type="button" data-material="glass" aria-pressed="true">Vidrio</button>
            <button type="button" data-material="metal" aria-pressed="false">Metal</button>
          </div>
        </div>
      </aside>
    </header>

    <nav class="dots" id="dots" aria-label="Tarjetas"></nav>

    <p class="sr" id="live" aria-live="polite"></p>

    <div id="fallback" hidden>
      <p>Tu navegador no puede mostrar el efecto WebGL. Aquí tienes las tarjetas en modo estático.</p>
      <ul id="fallback-list"></ul>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
